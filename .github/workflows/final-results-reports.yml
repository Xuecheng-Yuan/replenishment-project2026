name: Final official result reports
on:
  push:
    paths:
      - 'experiments/final_results_reports/**'
      - '.github/workflows/final-results-reports.yml'
  pull_request:
    paths:
      - 'experiments/final_results_reports/**'
      - '.github/workflows/final-results-reports.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas
      - run: python experiments/final_results_reports/verify_reports.py
