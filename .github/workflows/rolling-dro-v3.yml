name: Rolling DRO v3 checks
on:
  push:
    paths:
      - 'experiments/rolling_dro_v3/**'
      - 'experiments/demand_fill_v3/**'
      - 'experiments/version_comparison/**'
      - 'experiments/ro_extension/**'
      - 'experiments/full60_revision/**'
      - '.github/workflows/rolling-dro-v3.yml'
  pull_request:
    paths:
      - 'experiments/rolling_dro_v3/**'
      - 'experiments/demand_fill_v3/**'
      - 'experiments/version_comparison/**'
      - 'experiments/ro_extension/**'
      - 'experiments/full60_revision/**'
      - '.github/workflows/rolling-dro-v3.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r experiments/rolling_dro_v3/requirements_v3.txt
      - run: python -m unittest discover -s experiments/rolling_dro_v3/tests -p test_v2.py -v
      - run: python experiments/rolling_dro_v3/verify_published.py
      - run: python experiments/rolling_dro_v3/verify_workbook_v3.py
      - run: python -m unittest discover -s experiments/demand_fill_v3/tests -p test_v2.py -v
      - run: python experiments/demand_fill_v3/verify_published.py
      - run: python experiments/demand_fill_v3/verify_workbook_v3.py
      - run: python experiments/demand_fill_v3/verify_archive.py
      - run: python -m unittest discover -s experiments/ro_extension -p test_ro.py -v
      - run: python experiments/ro_extension/verify_ro.py
      - run: python experiments/ro_extension/verify_ablation.py
      - run: python experiments/version_comparison/build_comparison.py
