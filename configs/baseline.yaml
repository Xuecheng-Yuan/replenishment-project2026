project:
  random_seed: 2026

data:
  # train 必须完整包含 60 期；test 必须完整包含 28 期。
  expected_train_periods: 60
  expected_test_periods: 28

baseline:
  # 总体服务水平采用所有 SKU 总销售量 / 总需求量。
  target_service_level: 0.95

  # train 后 18 期只用于安全系数校准，前 42 期用于候选参数估计。
  validation_periods: 18

  # 当前库存系统中，本期末订单在下一期初到达。
  lead_time: 1

  # 从小到大搜索安全系数，选择首个达到 95% 验证服务水平的候选。
  z_min: 0.0
  z_max: 4.0
  z_step: 0.05

  # 需求与补货数量按整数处理，base-stock 水平向上取整。
  integer_quantity: true
